{{ define "main" }}
  {{ .Content }}

  {{ range .Site.RegularPages.GroupByPublishDate "2006" }}
    <h2>{{ .Key }}</h2>
    <ul>
      {{ range .Pages }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{  if ne .Lastmod .Date }}
            <small>
              ( изменено: {{ .Lastmod | time.Format "02.01.2006" }} )
            </small>
          {{ end }}          
        </li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
